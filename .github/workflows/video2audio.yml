name: VideoToAudio

on:
  workflow_dispatch:
  push:
    paths:
      - "video2audio/**"
      - ".github/workflows/video2audio.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Go test & vet
        working-directory: video2audio
        run: |
          set -o pipefail
          {
            echo "=== go version ==="; go version
            echo "=== go test ==="; go test -v ./...
            echo "=== go vet (linux) ==="; go vet ./...
            echo "=== go vet (windows) ==="; GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go vet ./...
            echo "=== go build (windows compile check) ==="; GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /dev/null .
            echo "=== ALL OK ==="
          } 2>&1 | tee /tmp/gotest.log
      - name: Annotate failure log
        if: failure()
        run: |
          python3 - <<'PYEOF'
          try:
              log = open('/tmp/gotest.log').read()
          except Exception as e:
              log = 'no log: ' + str(e)
          lines = log.splitlines()
          tail = lines[-50:]
          for i in range(0, len(tail), 15):
              chunk = '\n'.join(tail[i:i+15]).replace('\r', '').replace('%', '%25').replace('\n', '%0A')
              print('::error title=ci-log::' + chunk)
          PYEOF

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: /tmp/gotest.log
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install mingw-w64
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - name: Cache minimal ffmpeg
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: video2audio/.build
          key: ffmpeg-n7.1.5-minimal-lame-v1

      - name: Build minimal ffmpeg.exe
        run: bash video2audio/ci/build-ffmpeg.sh

      - name: Build VideoToAudio.exe
        run: bash video2audio/ci/build-exe.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoToAudio-win64
          path: video2audio/dist/
          if-no-files-found: error
