name: VideoToAudio

on:
  workflow_dispatch:
  push:
    paths:
      - "video2audio/**"
      - ".github/workflows/video2audio.yml"

permissions:
  contents: write
  actions: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Go test & vet
        working-directory: video2audio
        run: |
          set -o pipefail
          {
            echo "=== go version ==="; go version
            echo "=== go test ==="; go test -v ./...
            echo "=== go vet (linux) ==="; go vet ./...
            echo "=== go vet (windows) ==="; GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go vet ./...
            echo "=== go build (windows compile check) ==="; GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /dev/null .
            echo "=== ALL OK ==="
          } 2>&1 | tee /tmp/gotest.log

      - name: Publish failure log
        if: failure()
        run: |
          cp /tmp/gotest.log video2audio/ci/last-failure.log
          cd video2audio
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ci/last-failure.log
          git commit -m "ci: failure log [skip ci]" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || true
          # 同时输出到注解
          python3 - <<'PYEOF'
          try:
              log = open('/tmp/gotest.log').read()
          except Exception as e:
              log = 'no log: ' + str(e)
          lines = log.splitlines()
          tail = lines[-50:]
          for i in range(0, len(tail), 15):
              chunk = '\n'.join(tail[i:i+15]).replace('\r', '').replace('%', '%25').replace('\n', '%0A')
              print('::error title=ci-log::' + chunk)
          PYEOF

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install mingw-w64
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - name: Cache minimal ffmpeg
        uses: actions/cache@v4
        with:
          path: video2audio/.build
          key: ffmpeg-n7.1.5-minimal-lame-v1

      - name: Build minimal ffmpeg.exe
        run: |
          set -o pipefail
          bash video2audio/ci/build-ffmpeg.sh 2>&1 | tee /tmp/build-ffmpeg.log

      - name: Build VideoToAudio.exe
        run: |
          set -o pipefail
          bash video2audio/ci/build-exe.sh 2>&1 | tee /tmp/build-exe.log

      - name: Publish failure log
        if: failure()
        run: |
          { echo "===== build-ffmpeg.log ====="; cat /tmp/build-ffmpeg.log 2>/dev/null; echo "===== build-exe.log ====="; cat /tmp/build-exe.log 2>/dev/null; } > video2audio/ci/last-failure.log
          tail -c 200000 video2audio/ci/last-failure.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f video2audio/ci/last-failure.log
          git commit -m "ci: build failure log [skip ci]" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoToAudio-win64
          path: video2audio/dist/
          if-no-files-found: error

      - name: Commit exe to branch
        run: |
          cp video2audio/dist/VideoToAudio.exe video2audio/dist/VideoToAudio.exe.sha256 video2audio/dist/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f video2audio/dist/VideoToAudio.exe video2audio/dist/VideoToAudio.exe.sha256
          git commit -m "build: VideoToAudio.exe [skip ci]" || echo "exe unchanged"
          git push origin "HEAD:${GITHUB_REF_NAME}" || true
